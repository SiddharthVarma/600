name: CI Checks

on:
  push:
    branches: [main, dev, refactor]
  pull_request:
    branches: [main, dev]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The production build compiles every module, so a syntax error or a missing export fails here
      - name: Build
        run: npm run build

      - name: Check asset references exist
        run: python3 scripts/check_assets.py
