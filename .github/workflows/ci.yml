name: CI Checks

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check react-app.jsx syntax (JSX-aware)
        run: npx --yes esbuild react-app.jsx --outfile=/dev/null

      - name: Check index.html inline script syntax
        run: |
          python3 - <<'PY'
          import re, subprocess, sys
          html = open('index.html', encoding='utf-8').read()
          m = re.search(r'<script>(.*?)</script>', html, re.S)
          if not m:
              print('no inline <script> block found in index.html')
              sys.exit(1)
          proc = subprocess.run(['node', '--check'], input=m.group(1), capture_output=True, text=True)
          if proc.returncode != 0:
              print(proc.stderr)
              sys.exit(1)
          print('index.html inline script: OK')
          PY

      - name: Check asset references exist
        run: python3 scripts/check_assets.py
