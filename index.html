<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Six Hundred · Mission Control</title>
  <meta name="description" content="Keep 600 satellites alive: fix faults via the terminal, ride out solar flares and gamma-ray bursts, run science experiments for universities, and launch replacements." />
  <!-- the link preview (Slack, iMessage, LinkedIn, X): an absolute image URL, since some sites won't resolve a relative one -->
  <meta property="og:title" content="Six Hundred · Mission Control" />
  <meta property="og:description" content="Keep 600 satellites alive: fix faults via the terminal, ride out solar flares and gamma-ray bursts, run science experiments for universities, and launch replacements." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://varmasiddharth.com/sixhundred/" />
  <meta property="og:image" content="https://varmasiddharth.com/sixhundred/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="A ring of 600 satellites around a pixel-art Earth, a solar flare on the right and purple tentacles gripping satellites, with a reaction wheel fault ticket, a galaxy classification science request, and a terminal listing repair procedures." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://varmasiddharth.com/sixhundred/og.png" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛰️</text></svg>" />
  <link rel="stylesheet" href="/src/main/styles.css" />
</head>

<body>
  <main id="stage"><canvas id="constellation" aria-label="A constellation of 600 satellites"></canvas></main>
  <div class="sun-glow" id="sunGlow"></div>
  <div class="topline"><span class="brand">SIX HUNDRED<span class="count">· <span id="network">600/600</span></span></span>
    <span class="purse"><span class="credits" id="credits"></span><button class="launch" id="launch" hidden></button></span></div>
  <aside class="panel" id="panel">
    <button class="close" id="close" aria-label="Close">×</button>
    <div class="eyebrow" id="satName">SAT 421 · COMMAND UPLINK</div>
    <div class="status" id="status">STATUS: DEGRADED</div>
    <div class="term" id="term" aria-label="Command terminal"></div>
    <div class="log" id="log"></div>
  </aside>
  <div class="alerts" id="alerts" aria-live="polite"></div>
  <div class="science" id="science" aria-live="polite"></div>
  <button class="sudo-help" id="sudoHelp" aria-label="Replay SUDO's walkthrough" title="Replay SUDO's walkthrough">?</button>
  <div class="repair-modal" id="repairModal"><button class="repair-close" id="repairClose"
      aria-label="Close repair">×</button><iframe class="repair-frame" id="repairFrame"
      title="Manual spacecraft repair"></iframe></div>
  <div class="repair-modal" id="scienceModal"><button class="repair-close" id="scienceClose"
      aria-label="Close science request">×</button><iframe class="repair-frame" id="scienceFrame"
      title="Science request"></iframe></div>
  <div class="repair-modal" id="launchModal"><button class="repair-close" id="launchClose"
      aria-label="Close launch control">×</button><iframe class="repair-frame" id="launchFrame"
      title="Replacement launch"></iframe></div>
  <div class="repair-modal" id="grbModal"><button class="repair-close" data-abort aria-label="Abort procedure">×</button><iframe class="repair-frame" id="grbFrame"
      title="Gamma ray burst emergency response"></iframe></div>
  </div>
  <div class="repair-modal" id="debrisModal"><button class="repair-close" data-abort aria-label="Abort procedure">×</button><iframe class="repair-frame" id="debrisFrame"
      title="Collision avoidance emergency response"></iframe></div>
  </div>
  <div class="repair-modal" id="flareModal"><button class="repair-close" data-abort aria-label="Abort procedure">×</button><iframe class="repair-frame" id="flareFrame"
      title="Solar flare emergency response"></iframe></div>
  </div>
  <div class="modal" id="gameOver">
    <div class="modal-box">
      <div class="eyebrow">Constellation status</div>
      <h1 style="font-size:17px;color:var(--danger)">TOTAL LOSS</h1>
      <p>All 600 satellites have been lost. Good job.</p>
      <div class="modal-actions"><button class="command" id="restartAll"
          style="color:var(--danger);border-color:var(--danger)">RELAUNCH CONSTELLATION</button></div>
    </div>
  </div>
  <script type="module" src="/src/main/main.js"></script>
</body>

</html>
