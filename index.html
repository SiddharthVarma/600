<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Six Hundred — Mission Control</title>
  <meta name="description" content="Six Hundred: a 600-satellite constellation ops simulator. Real-time anomalies, physics-grounded repair minigames, and fleet-wide celestial events." />
  <meta property="og:title" content="Six Hundred — Mission Control" />
  <meta property="og:description" content="A 600-satellite constellation ops simulator with real-time anomalies and physics-grounded repair minigames." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛰️</text></svg>" />
  <style>
    :root {
      --bg: #050607;
      --ink: #e6e7e4;
      --muted: #7e8583;
      --dim: #343a39;
      --line: #222826;
      --accent: #c9ff4d;
      --warn: #ffd166;
      --danger: #ff5964;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    body {
      overflow: hidden;
    }

    #stage {
      position: fixed;
      inset: 0;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    .topline {
      position: fixed;
      top: 24px;
      left: 30px;
      right: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .18em;
      text-transform: uppercase;
      pointer-events: none;
    }

    .brand {
      color: var(--ink);
      font-size: 30px;
      letter-spacing: .22em;
    }

    .signal {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
    }

    .pulse {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }

    .hint {
      position: fixed;
      left: 30px;
      bottom: 24px;
      color: var(--dim);
      font-size: 13px;
      letter-spacing: .1em;
      text-transform: uppercase;
      transition: opacity .5s;
    }

    .alerts {
      position: fixed;
      top: 78px;
      left: 24px;
      width: min(330px, calc(100vw - 48px));
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 15;
      pointer-events: none;
    }

    .alert {
      position: relative;
      pointer-events: auto;
      cursor: pointer;
      background: rgba(14, 17, 16, .96);
      border: 1px solid #2b3230;
      border-radius: 10px;
      padding: 10px 12px 11px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .55);
      animation: alert-in .45s cubic-bezier(.22, .8, .2, 1);
    }

    .alert:hover {
      border-color: #3c4542;
    }

    .alert.out {
      animation: alert-out .3s forwards;
    }

    .alert-head {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .16em;
    }

    .alert-icon {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      background: #1c2321;
      display: grid;
      place-items: center;
      font-size: 10px;
    }

    .alert-app {
      flex: 1;
    }

    .alert-title {
      margin-top: 8px;
      font-size: 12px;
      letter-spacing: .06em;
    }

    .alert.crit .alert-title {
      color: var(--danger);
    }

    .alert-body {
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .alert-x {
      position: absolute;
      top: -7px;
      left: -7px;
      width: 18px;
      height: 18px;
      border: 0;
      border-radius: 50%;
      background: #2b3230;
      color: var(--ink);
      font: inherit;
      font-size: 11px;
      line-height: 18px;
      padding: 0;
      cursor: pointer;
      opacity: 0;
      transition: opacity .15s;
    }

    .alert:hover .alert-x {
      opacity: 1;
    }

    @keyframes alert-in {
      from {
        transform: translateX(calc(-100% - 40px));
        opacity: 0;
      }
    }

    @keyframes alert-out {
      to {
        transform: translateX(calc(-100% - 40px));
        opacity: 0;
      }
    }

    .panel {
      position: fixed;
      top: 0;
      right: 0;
      width: min(410px, 100vw);
      height: 100%;
      padding: 92px 34px 32px;
      background: rgba(7, 9, 9, .94);
      border-left: 1px solid var(--line);
      transform: translateX(102%);
      transition: transform .55s cubic-bezier(.22, .8, .2, 1);
      overflow: auto;
    }

    .panel.open {
      transform: translateX(0);
    }

    .close {
      position: absolute;
      top: 28px;
      right: 30px;
      border: 0;
      background: none;
      color: var(--muted);
      font: inherit;
      font-size: 18px;
      cursor: pointer;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 9px 0 4px;
      font-size: 25px;
      font-weight: 400;
      letter-spacing: .05em;
    }

    .status {
      color: var(--warn);
      font-size: 10px;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .status.degraded {
      color: var(--danger);
    }

    .status.ok {
      color: var(--accent);
    }

    .rule {
      height: 1px;
      background: var(--line);
      margin: 28px 0 20px;
    }

    .telemetry {
      display: grid;
      gap: 15px;
    }

    .metric {
      cursor: pointer;
    }

    .metric-head {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      margin-bottom: 7px;
    }

    .metric-name {
      color: var(--muted);
      letter-spacing: .14em;
    }

    .metric-value {
      color: var(--ink);
    }

    .bar {
      height: 4px;
      background: #1d2221;
      overflow: hidden;
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--accent);
      transition: width .7s;
    }

    .metric.hot .bar i {
      background: var(--danger);
    }

    .metric.hot .metric-value {
      color: var(--danger);
    }

    .meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.8;
    }

    .meta b {
      display: block;
      color: var(--ink);
      font-weight: 400;
    }

    .chart-wrap {
      margin-top: 24px;
      border-top: 1px solid var(--line);
      padding-top: 16px;
    }

    .chart-title {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .16em;
      margin-bottom: 10px;
    }

    #chart {
      width: 100%;
      height: 90px;
      display: block;
    }

    .commands {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button.command {
      border: 1px solid #303735;
      color: var(--muted);
      background: transparent;
      padding: 12px 10px;
      font: inherit;
      font-size: 10px;
      letter-spacing: .1em;
      cursor: pointer;
      transition: .2s;
    }

    button.command:hover {
      color: var(--ink);
      border-color: var(--accent);
    }

    .term {
      height: 196px;
      overflow-y: auto;
      padding: 10px 12px;
      border: 1px solid #262d2b;
      background: #070909;
      color: #b9c0bb;
      font-size: 11px;
      line-height: 1.65;
    }

    .term-line {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .term-prompt {
      color: var(--accent);
    }

    .term-files {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 12px;
    }

    .term-file {
      color: #8fd9ff;
      cursor: pointer;
      justify-self: start;
    }

    .term-file:hover {
      color: var(--ink);
      text-decoration: underline;
    }

    .term-muted {
      color: var(--muted);
    }

    .term-warn {
      color: var(--warn);
    }

    .term-ok {
      color: var(--accent);
    }

    .term-err {
      color: var(--danger);
    }

    .term-cursor {
      display: inline-block;
      width: 7px;
      height: 12px;
      margin-left: 1px;
      vertical-align: -2px;
      background: var(--accent);
      animation: term-blink 1s steps(1) infinite;
    }

    @keyframes term-blink {
      50% {
        opacity: 0;
      }
    }

    .log {
      min-height: 40px;
      margin-top: 18px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.6;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity .25s;
      background: rgba(0, 0, 0, .45);
    }

    .modal.show {
      pointer-events: auto;
      opacity: 1;
    }

    .repair-modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(0, 0, 0, .78);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s;
    }

    .repair-modal.show {
      opacity: 1;
      pointer-events: auto;
    }

    /* while a solar flare is active the sun side of the screen stays faintly warm, brightening toward the blackout */
    .sun-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      background: linear-gradient(270deg, rgba(255, 214, 150, .16), rgba(255, 214, 150, 0) 42%);
      transition: opacity 1.2s;
    }

    .panel.fleet .sat-only {
      display: none;
    }

    .alert.emergency {
      border-color: rgba(255, 89, 100, .65);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .55), 0 0 18px rgba(255, 89, 100, .18);
    }

    .alert.emergency .alert-app {
      color: var(--danger);
    }

    .term-dir {
      color: var(--ink);
      justify-self: start;
    }

    .flare-flash {
      position: fixed;
      inset: 0;
      z-index: 30;
      pointer-events: none;
      opacity: 0;
      background: linear-gradient(270deg, rgba(255, 248, 230, .6), rgba(255, 248, 230, 0) 70%);
      transition: opacity 1.6s ease-out;
    }

    .flare-flash.on {
      opacity: 1;
      transition: opacity .15s ease-in;
    }

    .repair-frame {
      width: min(1100px, 97vw);
      height: min(860px, 97vh);
      border: 1px solid #39403c;
      background: #070809;
      box-shadow: 0 0 40px rgba(0, 0, 0, .8);
    }

    .repair-close {
      position: absolute;
      top: 22px;
      right: 28px;
      border: 0;
      background: none;
      color: var(--muted);
      font: inherit;
      font-size: 24px;
      cursor: pointer;
    }

    .modal-box {
      width: min(390px, calc(100vw - 40px));
      border: 1px solid #39403c;
      background: #0a0d0c;
      padding: 26px;
    }

    .modal-box p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 24px;
    }

    .modal-actions button {
      flex: 1;
    }

    @media (max-width:600px) {
      .topline {
        left: 18px;
        right: 18px;
        top: 18px;
      }

      .hint {
        left: 18px;
        bottom: 18px;
      }

      .panel {
        padding-left: 24px;
        padding-right: 24px;
      }
    }
  </style>
</head>

<body>
  <main id="stage"><canvas id="constellation" aria-label="A constellation of 600 satellites"></canvas></main>
  <div class="sun-glow" id="sunGlow"></div>
  <div class="topline"><span class="brand">SIX HUNDRED</span><span class="signal"><i class="pulse"></i><span
        id="network">CONSTELLATION NOMINAL · 600/600</span></span></div>
  <div class="hint" id="hint">select a satellite to investigate</div>
  <aside class="panel" id="panel">
    <button class="close" id="close" aria-label="Close">×</button>
    <div class="eyebrow" id="panelEyebrow">Investigation / Orbital relay</div>
    <h1 id="satName">SATELLITE 421</h1>
    <div class="status" id="status">STATUS: DEGRADED</div>
    <div class="rule sat-only"></div>
    <div class="telemetry sat-only" id="telemetry"></div>
    <div class="chart-wrap sat-only">
      <div class="chart-title" id="chartTitle">TEMPERATURE / HISTORY</div><canvas id="chart"></canvas>
    </div>
    <div class="rule"></div>
    <div class="eyebrow" style="margin-bottom:12px">Command uplink</div>
    <div class="term" id="term" aria-label="Command terminal"></div>
    <div class="log" id="log">something is wrong</div>
  </aside>
  <div class="alerts" id="alerts" aria-live="polite"></div>
  <div class="repair-modal" id="repairModal"><button class="repair-close" id="repairClose"
      aria-label="Close repair">×</button><iframe class="repair-frame" id="repairFrame"
      title="Manual spacecraft repair"></iframe></div>
  <div class="repair-modal" id="grbModal"><button class="repair-close" data-abort aria-label="Abort procedure">×</button><iframe class="repair-frame" id="grbFrame"
      title="Gamma ray burst emergency response"></iframe></div>
  </div>
  <div class="repair-modal" id="debrisModal"><button class="repair-close" data-abort aria-label="Abort procedure">×</button><iframe class="repair-frame" id="debrisFrame"
      title="Collision avoidance emergency response"></iframe></div>
  </div>
  <div class="repair-modal" id="flareModal"><button class="repair-close" data-abort aria-label="Abort procedure">×</button><iframe class="repair-frame" id="flareFrame"
      title="Solar flare emergency response"></iframe></div>
  </div>
  <div class="flare-flash" id="flareFlash"></div>
  <div class="modal" id="gameOver">
    <div class="modal-box">
      <div class="eyebrow">Constellation status</div>
      <h1 style="font-size:17px;color:var(--danger)">TOTAL LOSS</h1>
      <p>All 600 satellites have been lost. Good job.</p>
      <div class="modal-actions"><button class="command" id="restartAll"
          style="color:var(--danger);border-color:var(--danger)">RELAUNCH CONSTELLATION</button></div>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('constellation'), ctx = canvas.getContext('2d'), panel = document.getElementById('panel');
    const earthImg = new Image(); earthImg.src = '600_earth_assets/earth.png';
    const chart = document.getElementById('chart'), cctx = chart.getContext('2d');
    let W, H, dpr, selected = null, paused = 0, lastAnomalyType = 'thermal', anomalyBag = [], activeEvent = null, pulses = [];
    const eventActive = () => !!activeEvent && activeEvent.phase === 'running'; // a pending event's ticket doesn't lock anything
    const satellites = Array.from({ length: 600 }, (_, i) => ({ id: i + 1, a: (Math.floor(i / 10) / 60) * Math.PI * 2 + (i % 10) * .018, ring: i % 10, r: .15 + (i % 10) * .038, speed: (.00006 + (i % 10) * .000004) * (i % 2 ? -1 : 1), phase: 0, anomaly: false, anomalyType: null, countdown: 0, lost: false, rejoining: false, rejoinProgress: 0, values: { RSSI: 82, TEMPERATURE: 71, POWER: 68, BATTERY: 91, CPU: 63, TORQUE: 89 } }));
    function updateNetwork() { const active = satellites.filter(s => !s.lost).length; const network = document.getElementById('network'); network.textContent = `CONSTELLATION ${active === 600 ? 'NOMINAL' : 'DEGRADED'} · ${active}/600`; if (active === 0) document.getElementById('gameOver').classList.add('show'); }
    document.getElementById('restartAll').onclick = () => {
      satellites.forEach(s => { s.anomaly = false; s.anomalyType = null; s.countdown = 0; s.lost = false; s.rejoining = false; s.rejoinProgress = 0; s.values = { RSSI: 82, TEMPERATURE: 71, POWER: 68, BATTERY: 91, CPU: 63, TORQUE: 89 }; });
      anomalyBag = []; lastAnomalyType = 'thermal'; selected = null; highlighted = []; clearAlerts();
      activeEvent = null; pulses = []; setSunGlow(0);
      ['grbModal', 'debrisModal', 'flareModal'].forEach(id => document.getElementById(id).classList.remove('show'));
      ['grbFrame', 'debrisFrame', 'flareFrame'].forEach(id => { document.getElementById(id).src = ''; });
      document.getElementById('gameOver').classList.remove('show');
      panel.classList.remove('open');
      document.getElementById('hint').textContent = 'select a satellite to investigate';
      document.getElementById('hint').style.opacity = 1;
      updateNetwork();
    };
    updateNetwork();
    function nextAnomalyType() { if (!anomalyBag.length) anomalyBag = ['thermal', 'wheel', 'power', 'process', 'orbit', 'solar', 'startracker', 'contact'].sort(() => Math.random() - .5); let next = anomalyBag.pop(); if (next === lastAnomalyType) { anomalyBag.unshift(next); next = anomalyBag.pop() || 'solar'; } return next; }
    function resize() { dpr = devicePixelRatio || 1; W = innerWidth; H = innerHeight; canvas.width = W * dpr; canvas.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); chart.width = chart.clientWidth * dpr; chart.height = 90 * dpr; cctx.setTransform(dpr, 0, 0, dpr, 0, 0); } addEventListener('resize', resize); resize();
    function point(s, t) { const rr = s.r * Math.min(W, H), angle = s.a + t * s.speed + s.phase, x = W * .5 + Math.cos(angle) * rr, y = H * .5 + Math.sin(angle) * rr; return { x, y }; }
    const RING_INTRO_DELAY = 1000, RING_INTRO_STAGGER = 200, RING_INTRO_FADE = 260;
    function ringProgress(i, t) { const p = (t - RING_INTRO_DELAY - i * RING_INTRO_STAGGER) / RING_INTRO_FADE; return Math.max(0, Math.min(1, p)); }
    function draw(t) {
      ctx.clearRect(0, 0, W, H); const slow = 1, unit = Math.min(W, H), cx = W * .5, cy = H * .5;
      ctx.save(); ctx.translate(cx, cy); ctx.strokeStyle = 'rgba(255,255,255,.055)'; ctx.lineWidth = 1; for (let i = 0; i < 10; i++) { const rp = ringProgress(i, t); if (rp <= 0) continue; ctx.globalAlpha = rp; ctx.beginPath(); ctx.arc(0, 0, unit * (.15 + i * .038), 0, Math.PI * 2); ctx.stroke(); } ctx.globalAlpha = 1; ctx.restore();
      const earthR = Math.max(19, unit * .052); if (earthImg.complete && earthImg.naturalWidth) { ctx.imageSmoothingEnabled = false; ctx.drawImage(earthImg, cx - earthR, cy - earthR, earthR * 2, earthR * 2); ctx.imageSmoothingEnabled = true; } else { ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(cx, cy, earthR, 0, Math.PI * 2); ctx.fill(); }
      satellites.forEach(s => { if (s.lost) return; const ringAlpha = ringProgress(s.ring, t); if (ringAlpha <= 0) return; const earthRatio = earthR / (unit * s.r); let decay = s.anomaly && s.anomalyType === 'orbit' ? Math.max(earthRatio, s.countdown / ANOMALY_FAIL_WINDOW) : 1; const p = point(s, t * slow); let px = W * .5 + (p.x - W * .5) * decay, py = H * .5 + (p.y - H * .5) * decay; if (s.rejoining) { s.rejoinProgress = Math.min(1, s.rejoinProgress + .006); const eased = 1 - Math.pow(1 - s.rejoinProgress, 3); px = W * .5 + (p.x - W * .5) * eased; py = H * .5 + (p.y - H * .5) * eased; if (s.rejoinProgress >= 1) { s.rejoining = false; if (selected === s) { document.getElementById('log').textContent = 'TELEMETRY NOMINAL · ORBIT RESTORED'; document.getElementById('hint').textContent = 'satellite recovered · network nominal'; } } } s.sx = px; s.sy = py; const hot = s.anomaly; ctx.globalAlpha = (s.rejoining ? .8 : 1) * ringAlpha * (s.anomalyType === 'flare' ? flareFlicker(t) : 1); ctx.beginPath(); ctx.arc(px, py, hot ? 3.6 : 1.5, 0, Math.PI * 2); ctx.fillStyle = hot ? '#ff4d4d' : `rgba(255,255,255,${.38 + .35 * (.5 + .5 * Math.sin(s.phase + t * .0005))})`; ctx.fill(); if (hot) { ctx.beginPath(); ctx.arc(px, py, 11 + Math.sin(t * .003) * 2.5, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(255,77,77,.3)'; ctx.stroke(); } ctx.globalAlpha = 1; }); drawEventFx(t); drawHighlight(t); requestAnimationFrame(draw);

    function trySpawnAnomaly() { if (eventActive()) return; const activeCount = satellites.filter(s => s.anomaly && !EVENT_TYPES.includes(s.anomalyType)).length; if (activeCount < MAX_CONCURRENT_ANOMALIES) { const available = satellites.filter(s => !s.lost && !s.anomaly && !s.rejoining), s = available[Math.floor(Math.random() * available.length)]; if (s) { s.anomaly = true; s.anomalyType = nextAnomalyType(); lastAnomalyType = s.anomalyType; s.countdown = ANOMALY_FAIL_WINDOW; if (s.anomalyType === 'thermal') { s.values.TEMPERATURE = 78; s.values.POWER = 82 } if (s.anomalyType === 'contact') s.values.RSSI = 52; if (s.anomalyType === 'power') s.values.POWER = 32; if (s.anomalyType === 'solar') s.values.BATTERY = 31; if (s.anomalyType === 'wheel') s.values.TORQUE = 34; if (s.anomalyType === 'process') s.values.CPU = 98; document.getElementById('hint').innerHTML = 'anomaly detected · locate the <span style="color:var(--danger)">red</span> signal'; pushAnomalyAlert(s); } } }
    function scheduleAnomaly() { setTimeout(() => { trySpawnAnomaly(); scheduleAnomaly(); }, 4000 + Math.random() * 6000); }
    setTimeout(() => { trySpawnAnomaly(); scheduleAnomaly(); }, 10000);

    // Celestial events. An event marks its satellites, plays its effect in the sky and posts a CRITICAL ticket with a
    // countdown. The player answers when ready: the ticket opens the ops computer in emergency/, the matching script
    // streams its uplink log (each satellite pulses as its command lands), then the event minigame opens. A ticket left
    // to run out resolves as a total loss.
    const EVENTS = {
      debris: { window: 55, script: 'debris_avoidance.py', verb: 'maneuver', game: 'debris', modal: 'debrisModal', frame: 'debrisFrame', name: 'DEBRIS FIELD', title: 'NORAD · DEBRIS ON COLLISION COURSE' },
      flare: { window: 50, script: 'flare_reconnect.py', verb: 'reconnect', game: 'flare', modal: 'flareModal', frame: 'flareFrame', name: 'SOLAR FLARE', title: 'PARKER SOLAR PROBE · SOLAR FLARE DETECTED' },
      grb: { window: 60, script: 'grb_scrub.py', verb: 'scrub', game: 'bitflip', modal: 'grbModal', frame: 'grbFrame', name: 'GAMMA-RAY BURST', title: 'FERMI · GAMMA-RAY BURST DETECTED' },
    };
    const EVENT_TYPES = ['debris', 'flare', 'bitflip'], NOMINAL_VALUES = () => ({ RSSI: 82, TEMPERATURE: 56, POWER: 68, BATTERY: 91, CPU: 63, TORQUE: 89 });
    const planeTag = ev => String(ev.sats[0].ring + 1).padStart(2, '0');
    function eventTicketBody(ev) {
      if (ev.phase === 'running') return 'Response in progress.';
      const m = `${Math.floor(ev.left / 60)}:${String(ev.left % 60).padStart(2, '0')}`;
      return ev.kind === 'debris' ? `Impact in ${m} · plane ${planeTag(ev)} · ${ev.sats.length} satellites`
        : ev.kind === 'flare' ? `Radio blackout in ${m} · ${ev.sats.length} satellites`
          : `${ev.sats.length} satellites corrupted · fault spreads in ${m}`; // a GRB arrives at light speed: the damage is already done
    }
    function startEvent(kind, sats) {
      sats.forEach(s => { s.anomaly = true; s.anomalyType = kind === 'grb' ? 'bitflip' : kind; s.countdown = 0; });
      const now = performance.now();
      activeEvent = { kind, sats, left: EVENTS[kind].window, phase: 'pending', tickAt: now, bits: Array.from({ length: 18 }, () => ({ da: Math.random() * .3 - .15, dr: Math.random() * 10 - 5, sz: 1 + Math.random() * 1.4 })) };
      pushAlert({ event: activeEvent, title: EVENTS[kind].title, body: eventTicketBody(activeEvent), crit: true, sticky: true, emergency: true });
    }
    function openEventTicket(ev) {
      if (eventActive() || activeEvent !== ev) return;
      highlighted = ev.sats.filter(s => !s.lost); highlightAt = performance.now();
      selected = null;
      panel.classList.add('open', 'fleet'); document.getElementById('hint').style.opacity = 0;
      document.getElementById('panelEyebrow').textContent = 'Emergency / Fleet operations';
      document.getElementById('satName').textContent = EVENTS[ev.kind].name;
      document.getElementById('log').textContent = '';
      renderFleetStatus();
      // a new emergency gets a fresh session; the same one (e.g. after an abort) keeps its history but lists the scripts again
      if (termSat !== FLEET || termEvent !== ev) termFleet(ev);
      else if (promptEl) { promptEl.remove(); termLsFleet(); }
    }
    function renderFleetStatus() {
      if (!panel.classList.contains('fleet')) return;
      const st = document.getElementById('status');
      st.className = 'status ' + (activeEvent ? 'degraded' : 'ok');
      st.textContent = activeEvent ? `STATUS: ${eventTicketBody(activeEvent).replace(/\.$/, '').toUpperCase()}` : 'STATUS: NO ACTIVE EMERGENCY';
    }
    function emergencyLog(file, ev, accepted) {
      const verb = Object.values(EVENTS).find(e => e.script === file).verb;
      if (!accepted) return [[`POST /api/fleet/${verb}  201`, 'term-muted'], ['400 rejected · no matching emergency', 'term-err']];
      const tc = () => '0x' + Math.floor(0x1000 + Math.random() * 0xefff).toString(16).toUpperCase();
      const source = { debris: `NORAD conjunction data pulled · plane ${planeTag(ev)}`, flare: 'Parker Solar Probe flare report pulled', grb: 'Fermi GBM trigger pulled' }[ev.kind];
      return [[source, 'term-muted'], [`s3://600-ops/fleet/${verb}.db found`, 'term-muted'], [`POST /api/fleet/${verb}  201`, 'term-muted'],
      ...ev.sats.filter(s => !s.lost).map(s => [`TC ${tc()} → SAT ${String(s.id).padStart(3, '0')}  accepted`, '', s]),
      ['202 accepted · handing control to operator', 'term-ok']];
    }
    async function runEmergency(file, run) {
      const ev = activeEvent, accepted = !!ev && ev.phase === 'pending' && EVENTS[ev.kind].script === file;
      const L = accepted && eventLauncher(ev);
      if (accepted) preload(L, `react.html?type=${EVENTS[ev.kind].game}&sats=${ev.sats.filter(s => !s.lost).map(s => s.id).join(',')}`);
      for (const [text, cls, sat] of emergencyLog(file, ev, accepted)) {
        await sleep(90 + Math.random() * 140); if (run !== termRun) return L && cancelPreload(L);
        termLine(text, cls);
        if (sat) pulse(sat, '230,231,228'); // the command lands: that satellite blinks on the rings
      }
      if (!accepted) { termLsFleet(); return; }
      await sleep(450); if (run !== termRun) return cancelPreload(L);
      termPrompt(FLEET);
      if (activeEvent === ev && ev.phase === 'pending') launchEvent(ev); else cancelPreload(L);
    }
    const eventLauncher = ev => launcher(EVENTS[ev.kind].frame, EVENTS[ev.kind].modal);
    function launchEvent(ev) {
      ev.phase = 'running'; highlighted = []; updateAlerts(); renderFleetStatus();
      panel.classList.remove('open'); document.getElementById('hint').style.opacity = 1;
      if (document.getElementById('repairModal').classList.contains('show')) closeRepair();
      reveal(eventLauncher(ev));
    }
    function abortEvent() { // × on an event window: back to waiting, countdown running again, the ticket opens it for another try
      const ev = activeEvent;
      if (!ev || ev.phase !== 'running') return;
      ev.phase = 'pending'; ev.tickAt = performance.now();
      eventLauncher(ev).shown = false;
      fadeCloseModal(EVENTS[ev.kind].modal, EVENTS[ev.kind].frame);
      updateAlerts(); renderFleetStatus();
      termNote('procedure aborted', 'term-warn', FLEET);
    }
    document.querySelectorAll('[data-abort]').forEach(b => { b.onclick = abortEvent; });
    function resolveEvent(saved) { // saved: ids of the satellites that came through
      const ev = activeEvent;
      if (!ev) return;
      ev.sats.forEach(s => { s.anomaly = false; s.anomalyType = null; s.countdown = 0; if (saved.has(s.id)) s.values = NOMINAL_VALUES(); else s.lost = true; });
      const n = ev.sats.length, k = ev.sats.filter(s => saved.has(s.id)).length, all = k === n;
      const [log, hint] = ev.kind === 'debris' ? [all ? 'DEBRIS FIELD CLEARED · FORMATION INTACT' : `DEBRIS NOT OUT-MANEUVERED · ${n - k} SATELLITES LOST`, all ? 'evasive maneuvers successful · network nominal' : 'orbital plane segment lost · debris field expanding']
        : ev.kind === 'flare' ? [`SOLAR FLARE PASSED · ${k}/${n} SATELLITES RECONNECTED`, all ? 'link held · network nominal' : 'radio blackout · satellites lost']
          : [`GAMMA RAY BURST RESOLVED · ${k}/${n} SATELLITES RECOVERED`, all ? 'all registers restored · network nominal' : 'gamma ray burst resolved · satellites lost'];
      updateNetwork();
      document.getElementById('log').textContent = log;
      document.getElementById('hint').textContent = hint;
      if (ev.phase === 'running') { eventLauncher(ev).shown = false; fadeCloseModal(EVENTS[ev.kind].modal, EVENTS[ev.kind].frame); }
      activeEvent = null; setSunGlow(0);
      highlighted = highlighted.filter(s => !ev.sats.includes(s));
      updateAlerts();
      pushAlert({ title: log, body: hint.charAt(0).toUpperCase() + hint.slice(1) + '.', crit: !all });
      if (selected && ev.sats.includes(selected)) { panel.classList.remove('open'); selected = null; }
      renderFleetStatus();
    }
    function tickEvent() { // once a second; the countdown pauses while the event minigame is open
      const ev = activeEvent;
      if (!ev || ev.phase !== 'pending') return;
      ev.left--; ev.tickAt = performance.now();
      if (ev.kind === 'flare') setSunGlow(.4 + .6 * (1 - ev.left / EVENTS.flare.window));
      if (ev.left <= 0) resolveEvent(new Set());
    }

    // effects in the sky
    function setSunGlow(v) { document.getElementById('sunGlow').style.opacity = v; }
    function pulse(s, rgb, life = 700, grow = .035) { pulses.push({ s, rgb, life, grow, t0: performance.now() }); }
    function flareFlicker(t) { // flare satellites flicker, faster as the blackout gets closer
      const ev = activeEvent;
      if (!ev || ev.kind !== 'flare' || ev.phase !== 'pending') return 1;
      return .55 + .45 * Math.abs(Math.sin(t * (.003 + .012 * (1 - ev.left / EVENTS.flare.window))));
    }
    function drawEventFx(t) {
      const ev = activeEvent;
      if (ev && ev.kind === 'debris' && ev.phase === 'pending') { // wreckage closes in along the threatened ring as the countdown runs down
        const mid = ev.sats[Math.floor(ev.sats.length / 2)], rr = mid.r * Math.min(W, H), dir = Math.sign(mid.speed) || 1;
        const p = Math.max(0, Math.min(1, 1 - (ev.left - (t - ev.tickAt) / 1000) / EVENTS.debris.window));
        const head = mid.a + t * mid.speed + mid.phase + dir * (1 - p) * 1.4;
        ev.bits.forEach((b, i) => {
          const a = head + dir * (b.da + i * .012), x = W * .5 + Math.cos(a) * (rr + b.dr), y = H * .5 + Math.sin(a) * (rr + b.dr);
          ctx.fillStyle = `rgba(255,170,110,${.35 + .45 * p})`; ctx.fillRect(x - b.sz / 2, y - b.sz / 2, b.sz, b.sz);
        });
      }
      pulses = pulses.filter(p => t - p.t0 < p.life);
      pulses.forEach(p => {
        if (p.s.lost || p.s.sx == null) return;
        const age = Math.max(0, t - p.t0);
        ctx.beginPath(); ctx.arc(p.s.sx, p.s.sy, 5 + age * p.grow, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(${p.rgb},${1 - age / p.life})`; ctx.lineWidth = 1.5; ctx.stroke(); ctx.lineWidth = 1;
      });
    }

    function scheduleGRB() { setTimeout(() => { triggerGRB(); scheduleGRB(); }, 240000 + Math.random() * 160000); }
    function triggerGRB() {
      if (activeEvent) return;
      const pool = satellites.filter(s => !s.lost && !s.anomaly && !s.rejoining), picked = [];
      if (pool.length < 5) return;
      while (picked.length < 5) picked.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
      startEvent('grb', picked);
      picked.forEach(s => pulse(s, '205,190,255', 1100, .05)); // no warning: one sudden ping as the burst lands
    }
    setTimeout(scheduleGRB, 30000);

    const DEBRIS_RING_SIZE = 60, DEBRIS_CLUSTER = 10;
    function pickDebrisCluster() {
      for (let attempt = 0; attempt < 30; attempt++) {
        const ring = Math.floor(Math.random() * 10), k0 = Math.floor(Math.random() * DEBRIS_RING_SIZE);
        const group = Array.from({ length: DEBRIS_CLUSTER }, (_, j) => satellites[10 * ((k0 + j) % DEBRIS_RING_SIZE) + ring]);
        if (group.every(s => !s.lost && !s.anomaly && !s.rejoining)) return group; // never take over a satellite that's already mid-problem
      }
      return null;
    }
    function scheduleDebris() { setTimeout(() => { triggerDebris(); scheduleDebris(); }, 260000 + Math.random() * 160000); }
    function triggerDebris() {
      if (activeEvent) return;
      const group = pickDebrisCluster();
      if (group) startEvent('debris', group);
    }
    setTimeout(scheduleDebris, 90000);

    const FLARE_SATS = 7;
    function scheduleFlare() { setTimeout(() => { triggerFlare(); scheduleFlare(); }, 230000 + Math.random() * 160000); }
    function triggerFlare() {
      if (activeEvent) return;
      const now = performance.now();
      // the flash comes in from the right, so the sunlit side is the right half of the screen
      const sunlit = satellites.filter(s => !s.lost && !s.anomaly && !s.rejoining && ringProgress(s.ring, now) > 0 && point(s, now).x > W * .5);
      if (sunlit.length < FLARE_SATS) return;
      const picked = [];
      while (picked.length < FLARE_SATS) picked.push(sunlit.splice(Math.floor(Math.random() * sunlit.length), 1)[0]);
      startEvent('flare', picked);
      const flash = document.getElementById('flareFlash');
      flash.classList.add('on'); setTimeout(() => flash.classList.remove('on'), 180);
      setSunGlow(.4);
    }
    setTimeout(scheduleFlare, 60000);
    setInterval(() => {
      const ticking = satellites.filter(s => s.anomaly && s.countdown > 0);
      ticking.forEach(s => {
        s.countdown--;
        if (s.countdown === 0) {
          const wasOrbit = s.anomalyType === 'orbit';
          s.anomaly = false; s.anomalyType = null; s.lost = true;
          updateNetwork();
          document.getElementById('hint').textContent = 'satellite lost · signal unavailable';
          if (selected === s) document.getElementById('log').textContent = wasOrbit ? 'SIGNAL LOST · SATELLITE BELOW RECOVERY ALTITUDE' : 'SIGNAL LOST · SATELLITE UNRECOVERABLE';
          pushAlert({ sat: s, title: `${satTag(s)} · SIGNAL LOST`, body: wasOrbit ? 'Satellite below recovery altitude.' : 'Satellite unrecoverable.', crit: true });
        } else if (selected === s) {
          document.getElementById('log').textContent = s.anomalyType === 'orbit' ? `ORBIT DECAY · IMPACT IN ${s.countdown}s` : `SATELLITE LOST IN ${s.countdown}s IF UNRESOLVED`;
        }
      });
      tickEvent();
      renderFleetStatus();
      updateAlerts();
    }, 1000);
  </script>
</body>
